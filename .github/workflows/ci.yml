name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shellcheck --version
          # Fail only on real errors; the script is a large, mature bash 3.2
          # target and intentionally carries some style-level warnings.
          shellcheck --severity=error mistral-support-bundle.sh test/redaction-test.sh

  test:
    name: Redaction tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest ships Bash 3.2 — the oldest version the script targets.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Show bash version
        run: bash --version | head -1
      - name: Run offline redaction tests
        run: bash test/redaction-test.sh
